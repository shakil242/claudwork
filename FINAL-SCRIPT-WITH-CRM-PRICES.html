<!--
================================================================================
FINAL SCRIPT - CheckoutChamp Default Prices + Buy 3 Default
================================================================================

This script:
1. Uses CheckoutChamp's built-in price calculation
2. Shows/hides color groups based on Buy 1/2/3
3. Updates variant values for CRM integration
4. Checks Buy 3 by default on page load
5. Lets CheckoutChamp handle all cart/price updates automatically
================================================================================
-->

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.2.1/js/intlTelInput.min.js"></script>

<script>
(function() {
  'use strict';

  console.log('🚀 CheckoutChamp Integration Starting...');

  // ============================================
  // CONFIGURATION
  // ============================================

  const CONFIG = {
    colorGroups: {
      1: 'cc-id-NIVJFiiDPDpe',   // Showerhead #1
      2: 'cc-id-9oUcQA0yVNSo',   // Showerhead #2
      3: 'colorGroup3Wrap'        // Showerhead #3
    },
    products: {
      '144': { qty: 1, items: [144] },           // Buy 1
      '145': { qty: 2, items: [145, 146] },      // Buy 2
      '147': { qty: 3, items: [147, 148, 149] }, // Buy 3 (DEFAULT)
      // Old IDs
      '102': { qty: 1, items: [144] },
      '104': { qty: 2, items: [145, 146] },
      '105': { qty: 1, items: [144] },
      '125': { qty: 2, items: [145, 146] },
      '126': { qty: 3, items: [147, 148, 149] },
      '103': { qty: 3, items: [147, 148, 149] }
    },
    variants: {
      'Chrome': 336,
      'Nickel': 337,
      'Black': 338
    }
  };

  // ============================================
  // STATE
  // ============================================

  const state = {
    selectedColors: { 1: 'Black', 2: 'Nickel', 3: 'Black' },
    currentQty: 3
  };

  // ============================================
  // SHOW/HIDE COLOR GROUPS
  // ============================================

  function updateColorGroupsVisibility(qty) {
    console.log(`🎨 Showing ${qty} color group(s)`);

    // Show/hide each group
    for (let i = 1; i <= 3; i++) {
      const groupId = CONFIG.colorGroups[i];
      const groupEl = document.getElementById(groupId);

      if (groupEl) {
        if (i <= qty) {
          groupEl.style.display = 'block';
          groupEl.style.visibility = 'visible';
          console.log(`✅ Group ${i}: VISIBLE`);
        } else {
          groupEl.style.display = 'none';
          console.log(`❌ Group ${i}: HIDDEN`);
        }
      }
    }

    state.currentQty = qty;
  }

  // ============================================
  // GET ACTIVE PACKAGE
  // ============================================

  function getActivePackage() {
    const checked = document.querySelector('input[name="product"]:checked');
    if (!checked) return CONFIG.products['147'];

    const val = checked.value;
    return CONFIG.products[val] || CONFIG.products['147'];
  }

  // ============================================
  // UPDATE PRODUCT VARIANTS
  // ============================================

  function updateProductVariants() {
    const product = getActivePackage();

    console.log(`📦 Active Package: Buy ${product.qty}`);

    // Update color group visibility
    updateColorGroupsVisibility(product.qty);

    // Get selected colors
    const colors = [
      state.selectedColors[1] || 'Chrome',
      state.selectedColors[2] || 'Nickel',
      state.selectedColors[3] || 'Black'
    ];

    console.log(`🎨 Selected Colors: ${colors.join(', ')}`);

    // Update each product checkbox with variant
    product.items.forEach((productId, index) => {
      const color = colors[index] || 'Chrome';
      const variantId = CONFIG.variants[color] || 336;

      const checkbox = document.querySelector(`input[name="product"][value="${productId}"]`);
      if (checkbox) {
        checkbox.setAttribute('variantvalue', variantId);
        console.log(`✅ Product ${productId} → Variant ${variantId} (${color})`);
      }
    });

    // Update CRM buttons
    const firstVariant = CONFIG.variants[colors[0]] || 336;
    const buttons = document.querySelectorAll('.complete-btn, .checkout-btn, [action="submit"], #cc-id-gJjWQNeaMLxD');
    buttons.forEach(btn => {
      btn.setAttribute('variantvalue', firstVariant);
    });

    console.log(`🔘 Buttons updated → Variant ${firstVariant}`);

    // CheckoutChamp will automatically update prices based on checked products
  }

  // ============================================
  // COLOR SELECTION (Desktop)
  // ============================================

  window.selectColor = function(group, color, el) {
    state.selectedColors[group] = color;

    // Update UI
    const groupEl = el?.closest('.color-options');
    if (groupEl) {
      groupEl.querySelectorAll('.color-opt').forEach(opt => opt.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    // Update label
    const labelSpans = {
      1: 'cc-id-b9TCoyCraMPr',
      2: 'cc-id-k0B7LiIWVsHS',
      3: 'cc-id-JdAyjRn0GwQ5'
    };

    const labelSpan = document.getElementById(labelSpans[group]);
    if (labelSpan) {
      labelSpan.textContent = color;
    }

    console.log(`🎨 Color ${group} → ${color}`);

    // Update variants
    setTimeout(() => updateProductVariants(), 100);
  };

  // ============================================
  // MOBILE COLOR SYNC
  // ============================================

  window.syncMobileColor = function(num) {
    const select = document.getElementById("mobileColor" + num);
    if (!select) return;

    const color = select.value;
    state.selectedColors[num] = color;

    // Update desktop selection
    const groupEl = document.getElementById('colorGroup' + num);
    if (groupEl) {
      groupEl.querySelectorAll('.color-opt').forEach((opt, idx) => {
        opt.classList.remove('active');
        const optColors = ['Chrome', 'Nickel', 'Black'];
        if (optColors[idx] === color) opt.classList.add('active');
      });
    }

    // Update color circle background
    let colorHex = '#bfc3c9';
    if (color === 'Nickel') colorHex = '#b8b8b8';
    if (color === 'Black') colorHex = '#333';
    select.style.backgroundImage = `radial-gradient(circle, ${colorHex} 0%, ${colorHex} 60%, transparent 61%)`;

    console.log(`🎨 Mobile Color ${num} → ${color}`);

    // Update variants
    setTimeout(() => updateProductVariants(), 100);
  };

  // ============================================
  // PRODUCT CHECKBOX CHANGE
  // ============================================

  function handleProductChange() {
    console.log('📦 Product selection changed');
    setTimeout(() => updateProductVariants(), 100);
  }

  // ============================================
  // PHONE INPUT
  // ============================================

  function initPhoneInput() {
    const phoneInput = document.querySelector("#phone");
    if (phoneInput && window.intlTelInput) {
      window.intlTelInput(phoneInput, {
        initialCountry: "us",
        separateDialCode: true,
        preferredCountries: ["us", "pk", "gb", "ae"],
        utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.2.1/js/utils.js"
      });
    }
  }

  // ============================================
  // BILLING SAME AS SHIPPING
  // ============================================

  function initBillingToggle() {
    const sameBillingCheckbox = document.querySelector("#sameBilling");
    const billingInfo = document.querySelector("#billingInfo");

    if (sameBillingCheckbox && billingInfo) {
      sameBillingCheckbox.addEventListener("change", function() {
        billingInfo.style.display = this.checked ? "none" : "block";
      });
    }
  }

  // ============================================
  // CHECK BUY 3 BY DEFAULT
  // ============================================

  function setDefaultSelection() {
    console.log('🎯 Setting default: Buy 3');

    // Uncheck all first
    document.querySelectorAll('input[name="product"]').forEach(cb => {
      cb.checked = false;
    });

    // Check Buy 3 (value="147")
    const buy3Checkbox = document.querySelector('input[name="product"][value="147"]');
    if (buy3Checkbox) {
      buy3Checkbox.checked = true;

      // Trigger change event so CheckoutChamp updates
      buy3Checkbox.dispatchEvent(new Event('change', { bubbles: true }));

      console.log('✅ Buy 3 checkbox checked');
    }

    // Update variants immediately
    setTimeout(() => updateProductVariants(), 100);
  }

  // ============================================
  // INITIALIZATION
  // ============================================

  function initialize() {
    console.log('🎯 Initializing...');

    // Init features
    initPhoneInput();
    initBillingToggle();

    // Set default selection (Buy 3)
    setDefaultSelection();

    // Attach product change listeners
    document.querySelectorAll('input[name="product"]').forEach(cb => {
      cb.addEventListener('change', handleProductChange);
      cb.addEventListener('click', handleProductChange);
    });

    // Force color group 3 visible
    setTimeout(() => {
      const group3 = document.getElementById('colorGroup3Wrap');
      if (group3) {
        group3.style.display = 'block';
        group3.style.visibility = 'visible';
        console.log('✅ Color Group 3 forced visible');
      }
    }, 300);

    console.log('✅ Integration Ready!');
  }

  // ============================================
  // START
  // ============================================

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initialize);
  } else {
    initialize();
  }

  window.addEventListener('load', function() {
    setTimeout(() => {
      setDefaultSelection();
      updateProductVariants();
    }, 500);
  });

})();
</script>

</body>
</html>
