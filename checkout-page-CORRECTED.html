<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <title>B42 Headphones - Complete Your Order</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.2.1/css/intlTelInput.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f9fafb; }

    .cc-cart-row {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 8px;
    }

    .cc-cart-row-margin {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cc-cart-row-img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
    }

    .cc-cart-prod-qty-bubble {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #000;
      color: #fff;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }

    .cc-cart-row-prod-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .cc-cart-row-variant {
      font-size: 12px;
      color: #666;
    }

    .cc-cart-row-prod-price {
      font-weight: 700;
      font-size: 15px;
    }

    .order-totals-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 14px;
    }

    .order-totals-row.total {
      border-top: 2px solid #000;
      margin-top: 8px;
      padding-top: 12px;
      font-weight: 700;
      font-size: 16px;
    }

    .discount { color: #22c55e; font-weight: 600; }
    .grandTotal { font-size: 18px; font-weight: 700; }

    #variantSummaryBox {
      margin: 8px 10px 4px 10px;
      padding: 8px 10px;
      background: #f9f9f9;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 12px;
    }

    .hidden { display: none !important; }
    .position-relative { position: relative; }
    .p-0 { padding: 0; }
    .m-0 { margin: 0; }
    .text-center { text-align: center; }
  </style>
</head>
<body>

  <!-- Hidden Product Checkboxes (for CRM integration) -->
  <div style="display: none;">
    <!-- Buy 1 Package (Product 144) -->
    <input type="checkbox" name="product" value="144" variantvalue="336" id="product144" />

    <!-- Buy 2 Package (Products 145 + 146) -->
    <input type="checkbox" name="product" value="145" variantvalue="336" id="product145" />
    <input type="checkbox" name="product" value="146" variantvalue="336" id="product146" />

    <!-- Buy 3 Package (Products 147 + 148 + 149) -->
    <input type="checkbox" name="product" value="147" variantvalue="336" id="product147" />
    <input type="checkbox" name="product" value="148" variantvalue="336" id="product148" />
    <input type="checkbox" name="product" value="149" variantvalue="336" id="product149" />
  </div>

  <!-- Order Summary Section -->
  <div class="order-summary cc-cart-wrapper" id="orderSummary">
    <div class="order-summary-header" onclick="toggleOrderSummary()">
      <span>Order Summary</span>
      <span class="arrow open" id="orderArrow">⌵</span>
    </div>

    <div class="cc-cart-wrapper" id="orderBod">
      <!-- Dynamic cart items will be inserted here -->
      <div id="cartItemsContainer"></div>

      <!-- Variant Summary -->
      <div id="variantSummaryContainer"></div>

      <!-- Order Totals -->
      <div class="order-totals">
        <div class="order-totals-row">
          <span>Shipping & Handling</span>
          <span class="dynamic-shipping-total" style="color:#22c55e;font-weight:600;">FREE</span>
        </div>
        <div class="order-totals-row">
          <span>Sub Total</span>
          <span id="subtotal" class="dynamic-price-total cc-cart-details-value">$0.00</span>
        </div>
        <div class="order-totals-row">
          <span>Total Saving</span>
          <span class="discount cc-cart-details-value" id="totalSaving">$0.00</span>
        </div>
        <div class="order-totals-row total">
          <span>Total:</span>
          <span id="grandTotal" class="grandTotal">USD $0.00</span>
        </div>
      </div>
    </div>
  </div>

  <!-- CRM Buttons -->
  <button
    class="complete-btn"
    id="completePurchaseBtn"
    type="button"
    action="submit"
    variantvalue="">
    COMPLETE PURCHASE
  </button>

  <button
    class="paypal-btn"
    id="paypalBtn"
    type="button"
    variantvalue="">
    Checkout with PayPal
  </button>

  <!-- jQuery (Required) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script>
    /**
     * B42 HEADPHONES - CHECKOUT INTEGRATION
     * Using Correct Product IDs (144-149) and Variant IDs (336-339)
     */

    (function() {
      'use strict';

      // ============================================
      // CONFIGURATION
      // ============================================

      const CONFIG = {
        // Product IDs from your CRM
        products: {
          // Buy 1 (Single)
          '144': {
            id: '144',
            name: 'B42 Headphones',
            basePrice: 79.99,
            qty: 1,
            regularPrice: 99.99,
            items: [144] // Single product
          },

          // Buy 2 (Combo)
          '145': {
            id: '145',
            name: 'B42 Headphones',
            basePrice: 74.99,
            qty: 2,
            regularPrice: 199.98,
            items: [145, 146] // Two products: item 1 and item 2
          },

          // Buy 3 (Triple)
          '147': {
            id: '147',
            name: 'B42 Headphones',
            basePrice: 69.99,
            qty: 3,
            regularPrice: 299.97,
            items: [147, 148, 149] // Three products: item 1, item 2, and item 3
          }
        },

        // Variant IDs (336-339) for colors
        variants: {
          'gray': 336,
          'blue': 337,
          'mint': 338,
          'violet': 339
        },

        // Color images
        colorImages: {
          'gray': 'https://assets.checkoutchamp.com/d23897ef-f2f0-4f8a-9936-38b5b7014e42/1764251436061_gray.png',
          'blue': 'https://assets.checkoutchamp.com/d23897ef-f2f0-4f8a-9936-38b5b7014e42/1764250465115_royal_blue.png',
          'mint': 'https://assets.checkoutchamp.com/d23897ef-f2f0-4f8a-9936-38b5b7014e42/1764251450259_cool_mint.png',
          'violet': 'https://assets.checkoutchamp.com/d23897ef-f2f0-4f8a-9936-38b5b7014e42/1764250435119_blush_violet.png'
        },

        // Color name mapping
        colorNames: {
          'gray': 'Gray',
          'blue': 'Royal Blue',
          'mint': 'Cool Mint',
          'violet': 'Blush Violet'
        }
      };

      // ============================================
      // STATE MANAGEMENT
      // ============================================

      const state = {
        selectedProduct: '144', // Default: Buy 1
        selectedColors: {
          1: 'gray',
          2: 'gray',
          3: 'gray'
        }
      };

      // ============================================
      // HELPER FUNCTIONS
      // ============================================

      function parsePrice(str) {
        return parseFloat(str.replace(/[^0-9.]/g, '')) || 0;
      }

      function formatPrice(num) {
        return '$' + num.toFixed(2);
      }

      function getActiveProduct() {
        const checked = $('input[name="product"]:checked').first();
        if (checked.length > 0) {
          const productId = checked.val();
          // Map to the main product ID (144, 145, or 147)
          if (productId == '144') return CONFIG.products['144'];
          if (productId == '145' || productId == '146') return CONFIG.products['145'];
          if (productId == '147' || productId == '148' || productId == '149') return CONFIG.products['147'];
        }
        return CONFIG.products['144'];
      }

      function getVariantForItem(itemNumber) {
        const color = state.selectedColors[itemNumber] || 'gray';
        return CONFIG.variants[color];
      }

      function calculatePricing() {
        const product = getActiveProduct();
        const perItemPrice = product.basePrice;
        const qty = product.qty;
        const subtotal = perItemPrice * qty;
        const regularTotal = product.regularPrice;
        const savings = regularTotal - subtotal;

        return {
          perItemPrice: perItemPrice,
          subtotal: subtotal,
          savings: savings > 0 ? savings : 0,
          total: subtotal,
          qty: qty,
          regularTotal: regularTotal
        };
      }

      // ============================================
      // PRODUCT CHECKBOX MANAGEMENT
      // ============================================

      function updateProductCheckboxes() {
        const product = getActiveProduct();
        const productItems = product.items;

        // First, uncheck all product checkboxes
        $('input[name="product"]').prop('checked', false);

        // Then check the ones we need
        productItems.forEach((productId, index) => {
          const checkbox = $(`input[name="product"][value="${productId}"]`);
          if (checkbox.length > 0) {
            checkbox.prop('checked', true);

            // Set variant for each item
            const itemNumber = index + 1;
            const variantId = getVariantForItem(itemNumber);
            checkbox.attr('variantvalue', variantId);

            console.log(`✅ Product ${productId} checked with variant ${variantId}`);
          }
        });
      }

      // ============================================
      // CART UPDATE
      // ============================================

      function updateCart() {
        const product = getActiveProduct();
        const pricing = calculatePricing();
        const colors = state.selectedColors;

        console.log('🛒 Updating cart...', {
          product: product.id,
          qty: product.qty,
          colors: colors
        });

        // Build cart rows
        let cartHTML = '<div class="cc-cart-container">';

        for (let i = 1; i <= product.qty; i++) {
          const color = colors[i] || 'gray';
          const colorName = CONFIG.colorNames[color];
          const image = CONFIG.colorImages[color];
          const itemPrice = pricing.perItemPrice.toFixed(2);

          cartHTML += `
            <div class="cc-cart-row">
              <div class="cc-cart-row-margin">
                <div class="position-relative">
                  <img class="cc-cart-row-img"
                       src="${image}"
                       alt="${product.name}" />
                  <div class="cc-cart-prod-qty-bubble">1</div>
                </div>
                <div style="flex: 1;">
                  <div class="cc-cart-row-prod-title">${product.name} #${i}</div>
                  <div class="cc-cart-row-variant">
                    <span style="font-weight:bold;">Color:</span>
                    <span>${colorName}</span>
                  </div>
                </div>
                <div class="text-center">
                  <div class="cc-cart-row-prod-price">$${itemPrice}</div>
                </div>
              </div>
            </div>
          `;
        }

        cartHTML += '</div>';

        // Update cart container
        const cartContainer = document.getElementById('cartItemsContainer');
        if (cartContainer) {
          cartContainer.innerHTML = cartHTML;
        }

        // Update totals
        updateTotals(pricing);

        // Update product checkboxes with correct variants
        updateProductCheckboxes();

        // Update CRM buttons
        updateCRMButtons();

        // Update color summary
        updateColorSummary();
      }

      function updateTotals(pricing) {
        const subtotalEl = document.getElementById('subtotal');
        const savingsEl = document.getElementById('totalSaving');
        const totalEl = document.getElementById('grandTotal');

        if (subtotalEl) subtotalEl.textContent = formatPrice(pricing.subtotal);
        if (savingsEl) savingsEl.textContent = formatPrice(pricing.savings);
        if (totalEl) totalEl.textContent = `USD ${formatPrice(pricing.total)}`;

        console.log('💰 Totals updated:', pricing);
      }

      function updateCRMButtons() {
        const product = getActiveProduct();
        // For CRM buttons, use the first product ID as the main identifier
        const mainProductId = product.items[0];
        const variantId = getVariantForItem(1); // Use first item's variant

        // Update all submit buttons
        const completeBtn = document.getElementById('completePurchaseBtn');
        const paypalBtn = document.getElementById('paypalBtn');

        if (completeBtn) {
          completeBtn.setAttribute('variantvalue', variantId);
        }

        if (paypalBtn) {
          paypalBtn.setAttribute('variantvalue', variantId);
        }

        console.log('✅ CRM Buttons updated - Product:', mainProductId, 'Variant ID:', variantId);
      }

      function updateColorSummary() {
        const product = getActiveProduct();
        const colors = state.selectedColors;

        let html = '<div id="variantSummaryBox">';
        html += '<div style="font-weight:700; margin-bottom:5px; color:#333;">Selected Colors:</div>';

        for (let i = 1; i <= product.qty; i++) {
          const color = colors[i] || 'gray';
          const colorName = CONFIG.colorNames[color];
          const variantId = CONFIG.variants[color];

          // Color dots
          const colorHex = {
            'gray': '#9ca3af',
            'blue': '#3b82f6',
            'mint': '#6ee7b7',
            'violet': '#c084fc'
          };

          html += `
            <div style="display:flex; align-items:center; gap:6px; margin:3px 0;">
              <div style="width:10px;height:10px;border-radius:50%;background:${colorHex[color]};border:1px solid #ccc;"></div>
              <span style="color:#555;">Item #${i}: <strong>${colorName}</strong> (Variant: ${variantId})</span>
            </div>
          `;
        }

        html += '</div>';

        const container = document.getElementById('variantSummaryContainer');
        if (container) {
          container.innerHTML = html;
        }
      }

      // ============================================
      // PACKAGE SELECTION
      // ============================================

      let updating = false;

      // Allow external code to change package
      window.selectPackage = function(packageType) {
        if (updating) return;
        updating = true;

        if (packageType === 'buy1') {
          state.selectedProduct = '144';
        } else if (packageType === 'buy2') {
          state.selectedProduct = '145';
        } else if (packageType === 'buy3') {
          state.selectedProduct = '147';
        }

        console.log('📦 Package changed to:', state.selectedProduct);

        setTimeout(() => {
          updateCart();
          updating = false;
        }, 100);
      };

      // Allow external code to change colors
      window.selectColor = function(itemNumber, color) {
        if (CONFIG.variants[color]) {
          state.selectedColors[itemNumber] = color;
          console.log(`🎨 Item ${itemNumber} color changed to: ${color}`);
          setTimeout(() => {
            updateCart();
          }, 100);
        } else {
          console.error('Invalid color:', color);
        }
      };

      // ============================================
      // ORDER SUMMARY TOGGLE
      // ============================================

      window.toggleOrderSummary = function() {
        const orderBod = document.getElementById('orderBod');
        const arrow = document.getElementById('orderArrow');

        if (orderBod && arrow) {
          orderBod.classList.toggle('hidden');
          arrow.classList.toggle('open');
        }
      };

      // ============================================
      // INITIALIZATION
      // ============================================

      $(document).ready(function() {
        console.log('🚀 B42 Headphones Integration Loading...');

        // Initial load
        setTimeout(() => {
          console.log('🎯 Initial cart load...');
          updateCart();
        }, 500);

        console.log('✅ B42 Integration Ready');
        console.log('📊 Product IDs: 144 (Buy 1), 145+146 (Buy 2), 147+148+149 (Buy 3)');
        console.log('🎨 Variant IDs: 336 (Gray), 337 (Royal Blue), 338 (Cool Mint), 339 (Blush Violet)');
      });

      // Expose for debugging
      window.B42Cart = {
        state: state,
        config: CONFIG,
        updateCart: updateCart,
        selectPackage: window.selectPackage,
        selectColor: window.selectColor
      };

    })();

  </script>

</body>
</html>
